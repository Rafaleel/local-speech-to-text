<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1b24"/>
      <stop offset="1" stop-color="#09090d"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".04"/>
    </linearGradient>
    <radialGradient id="knob" cx=".35" cy=".3" r=".9">
      <stop offset="0" stop-color="#ff9aa6"/>
      <stop offset=".6" stop-color="#f25969"/>
      <stop offset="1" stop-color="#a02338"/>
    </radialGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <!-- floating pill -->
  <rect x="26" y="48" width="204" height="64" rx="32" fill="url(#pill)" stroke="#ffffff" stroke-opacity=".38" stroke-width="2"/>
  <!-- record knob with microphone -->
  <circle cx="62" cy="80" r="25" fill="url(#knob)"/>
  <rect x="55" y="63" width="14" height="24" rx="7" fill="#fff6f6"/>
  <path d="M49 79a13 13 0 0 0 26 0M62 92v7M55 99h14" fill="none" stroke="#fff6f6" stroke-width="3.4" stroke-linecap="round"/>
  <!-- waveform -->
  <g fill="#f6c945">
    <rect x="102" y="74" width="7" height="12" rx="3.5" opacity=".55"/>
    <rect x="116" y="66" width="7" height="28" rx="3.5" opacity=".7"/>
    <rect x="130" y="58" width="7" height="44" rx="3.5"/>
    <rect x="144" y="68" width="7" height="24" rx="3.5"/>
    <rect x="158" y="62" width="7" height="36" rx="3.5" opacity=".85"/>
    <rect x="172" y="72" width="7" height="16" rx="3.5" opacity=".65"/>
    <rect x="186" y="77" width="7" height="6" rx="3" opacity=".45"/>
    <rect x="200" y="77" width="7" height="6" rx="3" opacity=".3"/>
  </g>
  <!-- transcribed text -->
  <g fill="#ffffff">
    <rect x="42" y="136" width="172" height="11" rx="5.5" opacity=".78"/>
    <rect x="42" y="158" width="138" height="11" rx="5.5" opacity=".5"/>
    <rect x="42" y="180" width="96" height="11" rx="5.5" opacity=".3"/>
  </g>
  <!-- theme colors -->
  <circle cx="76" cy="220" r="7" fill="#3dff7a"/>
  <circle cx="102" cy="220" r="7" fill="#19d3ff"/>
  <circle cx="128" cy="220" r="7" fill="#e0a458"/>
  <circle cx="154" cy="220" r="7" fill="#ffb38a"/>
  <circle cx="180" cy="220" r="7" fill="#d0a63a"/>
</svg>
