<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a4bc4"/>
      <stop offset="1" stop-color="#2a1f70"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="knob" cx=".35" cy=".3" r=".9">
      <stop offset="0" stop-color="#ffb3bc"/>
      <stop offset=".55" stop-color="#f25969"/>
      <stop offset="1" stop-color="#b02a40"/>
    </radialGradient>
  </defs>
  <rect x="4" y="4" width="248" height="248" rx="58" fill="url(#bg)"/>
  <rect x="4" y="4" width="248" height="124" rx="58" fill="url(#gloss)"/>
  <!-- floating pill -->
  <rect x="18" y="38" width="220" height="92" rx="46" fill="#ffffff" fill-opacity=".2" stroke="#ffffff" stroke-opacity=".75" stroke-width="4"/>
  <!-- record knob with microphone -->
  <circle cx="66" cy="84" r="34" fill="url(#knob)" stroke="#ffffff" stroke-opacity=".6" stroke-width="3"/>
  <rect x="55" y="61" width="22" height="36" rx="11" fill="#ffffff"/>
  <path d="M46 82a20 20 0 0 0 40 0M66 102v11M55 113h22" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <!-- waveform -->
  <g fill="#ffd24a">
    <rect x="114" y="74" width="10" height="20" rx="5" opacity=".7"/>
    <rect x="130" y="62" width="10" height="44" rx="5"/>
    <rect x="146" y="52" width="10" height="64" rx="5"/>
    <rect x="162" y="66" width="10" height="36" rx="5"/>
    <rect x="178" y="58" width="10" height="52" rx="5" opacity=".9"/>
    <rect x="194" y="74" width="10" height="20" rx="5" opacity=".7"/>
    <rect x="210" y="79" width="10" height="10" rx="5" opacity=".5"/>
  </g>
  <!-- transcribed text -->
  <g fill="#ffffff">
    <rect x="30" y="150" width="196" height="15" rx="7.5" opacity=".95"/>
    <rect x="30" y="174" width="154" height="15" rx="7.5" opacity=".7"/>
  </g>
  <!-- theme colors -->
  <circle cx="58" cy="224" r="10" fill="#3dff7a"/>
  <circle cx="93" cy="224" r="10" fill="#19d3ff"/>
  <circle cx="128" cy="224" r="10" fill="#ffb347"/>
  <circle cx="163" cy="224" r="10" fill="#ff8fb3"/>
  <circle cx="198" cy="224" r="10" fill="#d0a63a"/>
</svg>
